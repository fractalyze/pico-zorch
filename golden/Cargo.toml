[package]
name = "pico-zorch-golden"
version = "0.1.0"
edition = "2021"
publish = false

# Golden-vector generator for the pico-zorch byte-match tests. Links the SAME
# Plonky3 fork rev Pico v2.0.0 vendors (brevis-network/Plonky3@7fbe1908), and
# instantiates Pico's exact KoalaBearPoseidon2 stark config (round constants
# from pico v2.0.0 vm/src/primitives/mod.rs, FRI log_blowup=1 / 84 queries /
# 16 pow bits from vm/src/configs/stark_config/kb_poseidon2.rs), so the JSON
# fixtures under pico_zorch/**/testdata/golden/ are the reference semantics by
# construction.

[dependencies]
# Plonky3 rev is written exactly as Pico writes it (`7fbe190`, the fork
# rev v2.0.0 vendors). Cargo keys a git source on the rev *string*, not the
# commit it resolves to, so spelling it differently would give us a second
# copy of every p3 crate whose types do not unify with Pico's.
p3-air = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-challenger = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-commit = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-dft = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-field = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-fri = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-koala-bear = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-matrix = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-merkle-tree = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-poseidon2 = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-symmetric = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-uni-stark = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-util = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
p3-maybe-rayon = { git = "https://github.com/brevis-network/Plonky3.git", rev = "7fbe190" }
# The reference septic curve, for the `septic` feature only. Pico's own
# arithmetic rather than a reimplementation of it from the spec — but pico-vm
# needs a nightly compiler (`#![feature(const_type_id)]`), so it is optional
# and the default fixtures keep building on stable.
pico-vm = { git = "https://github.com/brevis-network/pico.git", tag = "v2.0.0", optional = true }
serde = "1"
serde_json = "1"

# The fixture generator MUST build without this: the reference grind is
# `find_any` over a rayon iterator, so parallelism makes which witness it
# finds non-reproducible. The reference-bench binary enables it to time the
# prover the way Pico ships it (its own default features include rayon).
[features]
parallel = ["p3-maybe-rayon/parallel"]
# The septic-curve fixtures. Pulls in pico-vm, which requires nightly:
#   cargo +nightly run --features septic --bin septic-golden
septic = ["dep:pico-vm"]

[[bin]]
name = "pico-zorch-golden"
path = "src/main.rs"

[[bin]]
name = "reference-bench"
path = "src/bench.rs"

# Separate from the main generator so the stable toolchain still produces
# every other fixture.
[[bin]]
name = "septic-golden"
path = "src/septic.rs"
required-features = ["septic"]
